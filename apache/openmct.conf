<VirtualHost *:80>
	ServerName localhost

	ServerAdmin localhost
	DocumentRoot /usr/local/apache2/htdocs/openmct/
	AddDefaultCharset utf-8
	AllowEncodedSlashes NoDecode

	<Directory "/usr/local/apache2/htdocs/openmct/">
		AuthType Basic
		AuthName "Restricted Access to OpenMCT"
		AuthUserFile /usr/local/apache2/conf/.htpasswd
		Require valid-user
	</Directory>

	ErrorLog logs/openmct-error.log
	CustomLog logs/openmct-access.log combined

	# Compress text for clients on the Pi's Wi-Fi: openmct.js is 5 MB and a
	# 1000-packet /api/packets page about 260 KB of JSON, both a fraction of
	# that gzipped. The websocket is not affected.
	AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json
	# Same ETag compressed or not: with the default "-gzip" suffix Apache never
	# answers 304, and every reload would download Open MCT again.
	DeflateAlterETag NoChange

	RequestHeader set "X-Forwarded-Proto" expr=%{REQUEST_SCHEME}
	ProxyErrorOverride Off

	# Ground station backend (backend/src/api.py): REST API, live websocket and
	# the generated API reference, all behind the same login as Open MCT.
	<LocationMatch "^/(api|ws|docs|openapi\.json)">
		AuthType Basic
		AuthName "Restricted Access to OpenMCT"
		AuthUserFile /usr/local/apache2/conf/.htpasswd
		Require valid-user
		RequestHeader unset Authorization
	</LocationMatch>

	ProxyPass "/ws" "ws://backend:8000/ws"
	ProxyPassReverse "/ws" "ws://backend:8000/ws"
	ProxyPass "/api/" "http://backend:8000/api/"
	ProxyPassReverse "/api/" "http://backend:8000/api/"
	ProxyPass "/docs" "http://backend:8000/docs"
	ProxyPass "/openapi.json" "http://backend:8000/openapi.json"

	<Location "/server-status">
		SetHandler server-status
		AuthType Basic
		AuthName "Restricted Access to Server Status"
		AuthUserFile /usr/local/apache2/conf/.htpasswd
		Require valid-user
	</Location>

</VirtualHost>
