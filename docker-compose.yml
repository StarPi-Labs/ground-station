version: '3.7'
services:
  apache:
    build: apache
    ports:
      - '8040:80'
    volumes:
      - openmct-dist:/usr/local/apache2/htdocs/openmct
    networks:
      - docker_openmct_link
    extra_hosts:
      - "host.docker.internal:host-gateway"
  openmct:
    build: openmct
    volumes:
      - openmct-dist:/openmct/site
    networks:
      - docker_openmct_link
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  openmct-dist:
networks:
  docker_openmct_link:
    name: docker_openmct_link
    driver: bridge
